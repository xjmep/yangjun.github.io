    let dt = (now - lastTime) / 16.667;
    lastTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 1;
    if (dt > 3) dt = 3;
    time += dt * 0.016;
    render(dt);
    rafId = requestAnimationFrame(loop);
  }

  return {
    resize,
    start() {
      if (active) return;
      active = true;
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    },
    stop() { active = false; cancelAnimationFrame(rafId); },
    setPointer(x, y, on) { mouse.x = x; mouse.y = y; mouse.active = on; },
    onClick() { paletteIdx = (paletteIdx + 1) % PALETTES.length; }
  };
}

/* =========================================================
   10. 沙漠
   ========================================================= */
function createDesert(canvas) {
  'use strict';
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0;
  let active = false, rafId = 0, lastTime = 0, time = 0;
  let paletteIdx = 0;

  const mouse = { x: -1e4, y: -1e4, active: false };

  const PALETTES = [
    { sky: ['#2260a0', '#5a9ad0', '#b8d8ec', '#f4ecd8'],
      sun: '255,252,235', sunY: 0.18, starA: 0,
      sand: [
        ['#e8cc96', '#d4ac74', '#c09458'],
        ['#dcb87e', '#c8a066', '#a88248'],
        ['#cc9e64', '#b48650', '#946638'],
        ['#b8864a', '#986a36', '#785026']
      ]
    },
    { sky: ['#1a0a24', '#551a38', '#c04a38', '#f2a24e'],
      sun: '255,185,105', sunY: 0.60, starA: 0.30,
      sand: [
        ['#c68c5c', '#a86e3c', '#8a5424'],
        ['#b47a48', '#945e30', '#74441c'],
        ['#a06838', '#804e24', '#603614'],
        ['#8a5428', '#6c3e1a', '#4e2a0e']
      ]
    },
    { sky: ['#02030e', '#080e28', '#162444', '#26365a'],
      sun: '205,225,255', sunY: 0.22, starA: 1.00,
      sand: [
        ['#3a3050', '#2a2040', '#1a1428'],
        ['#302648', '#201838', '#120e20'],
        ['#28203e', '#18122e', '#0c0818'],
        ['#1e1832', '#100c22', '#060410']
      ]
    },
    { sky: ['#2a1428', '#5a2438', '#a04a48', '#e8a078'],
      sun: '255,220,180', sunY: 0.52, starA: 0.20,
      sand: [
        ['#c47452', '#a45834', '#844018'],
        ['#b46640', '#8c4a28', '#6c3814'],
        ['#a05834', '#7c3e1e', '#5c2c10'],
        ['#884c28', '#663418', '#442008']
      ]
    }
  ];

  const LAYERS = [
    { baseY: 0.660, amp: 24, amp2: 10, freq: 0.0017, freq2: 0.0042, speed: 0.10 },
    { baseY: 0.745, amp: 38, amp2: 15, freq: 0.0023, freq2: 0.0055, speed: 0.20 },
    { baseY: 0.845, amp: 58, amp2: 22, freq: 0.0030, freq2: 0.0070, speed: 0.34 },
    { baseY: 0.970, amp: 80, amp2: 30, freq: 0.0039, freq2: 0.0088, speed: 0.52 }
  ];

  let layers = [];
  let stars = [];
  let dust = [];

  function buildLayers() {
    layers = [];
    for (let i = 0; i < LAYERS.length; i++) {
      const d = LAYERS[i];
      layers.push({
        baseY: H * d.baseY,
        amp: d.amp * (H / 900),
        amp2: d.amp2 * (H / 900),
        freq: d.freq,
        freq2: d.freq2,
        speed: d.speed,
        ph: rand(0, TAU),
        ph2: rand(0, TAU)
      });
    }
  }

  function buildStars() {
    stars = [];
    const n = Math.max(50, Math.min(280, Math.round(W * H / 8500)));
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.58,
        r: rand(0.3, 1.3),
        a: rand(0.15, 0.9),
        tw: Math.random() * TAU,
        ts: rand(0.4, 1.9)
      });
    }
  }

  function buildDust() {
    dust = [];
    const n = Math.max(40, Math.min(140, Math.round(W / 14)));
    for (let i = 0; i < n; i++) {
      const depth = Math.random();
      dust.push({
        x: Math.random() * W,
        y: rand(H * 0.45, H),
        r: 0.5 + depth * 1.8,
        vx: (0.2 + depth * 0.9) * (Math.random() < 0.5 ? -1 : 1),
        vy: -(0.05 + depth * 0.25),
        ph: Math.random() * TAU,
        alpha: 0.10 + depth * 0.35
      });
    }
  }

  function resize() {
    const r = fitCanvas(canvas);
    W = r.W; H = r.H;
    buildLayers();
    buildStars();
    buildDust();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  function duneY(L, x) {
    const u = x * L.freq;
    return L.baseY
         + Math.sin(u + L.ph) * L.amp
         + Math.sin(u * 2.7 + L.ph2) * L.amp2
         + Math.sin(u * 6.1 + L.ph * 1.7) * L.amp2 * 0.35;
  }

  function render(dt) {
    const P = PALETTES[paletteIdx];

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.80);
    sky.addColorStop(0,    P.sky[0]);
    sky.addColorStop(0.40, P.sky[1]);
    sky.addColorStop(0.72, P.sky[2]);
    sky.addColorStop(1,    P.sky[3]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    if (P.starA > 0) {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const tw = 0.5 + 0.5 * Math.sin(time * s.ts + s.tw);
        const a = s.a * tw * P.starA;
        if (a < 0.02) continue;
        ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, TAU);
        ctx.fill();
      }
    }

    const sx = W * 0.52 + (mouse.active ? (mouse.x - W / 2) * 0.016 : 0);
    const sy = H * P.sunY;
    const sr = Math.min(W, H) * 0.052;

    const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 16);
    halo.addColorStop(0,    'rgba(' + P.sun + ',0.52)');
    halo.addColorStop(0.16, 'rgba(' + P.sun + ',0.20)');
    halo.addColorStop(0.45, 'rgba(' + P.sun + ',0.06)');
    halo.addColorStop(1,    'rgba(' + P.sun + ',0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(sx, sy, sr * 16, 0, TAU); ctx.fill();

    const disk = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    disk.addColorStop(0,    'rgba(255,255,255,0.96)');
    disk.addColorStop(0.5,  'rgba(' + P.sun + ',0.92)');
    disk.addColorStop(1,    'rgba(' + P.sun + ',0.55)');
    ctx.fillStyle = disk;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();

    ctx.globalCompositeOperation = 'source-over';

    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      const cols = P.sand[li];

      ctx.beginPath();
      ctx.moveTo(-10, H + 10);
      for (let x = -10; x <= W + 10; x += 10) {
        ctx.lineTo(x, duneY(L, x));
      }
      ctx.lineTo(W + 10, H + 10);
      ctx.closePath();

      const g = ctx.createLinearGradient(0, L.baseY - L.amp * 2, 0, H);
      g.addColorStop(0,    cols[0]);
      g.addColorStop(0.45, cols[1]);
      g.addColorStop(1,    cols[2]);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,240,220,0.055)';
      ctx.lineWidth = 1;
      for (let k = 1; k <= 7; k++) {
        ctx.beginPath();
        for (let x = -10; x <= W + 10; x += 14) {
          const y = duneY(L, x) + k * (13 + li * 2)
                  + Math.sin(x * 0.018 + k * 0.9 + li) * 3.4;
          if (x === -10) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < dust.length; i++) {
      const p = dust[i];
      p.ph += 0.02 * dt;
      p.x += p.vx * dt * 0.6;
      p.y += p.vy * dt * 0.6;

      if (p.x < -20) p.x = W + 20;
      else if (p.x > W + 20) p.x = -20;
      if (p.y < H * 0.42) { p.y = H + 10; p.x = Math.random() * W; }

      ctx.fillStyle = 'rgba(255,240,210,' + (p.alpha * 0.7) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y + Math.sin(p.ph) * 4, p.r, 0, TAU);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    const vg = ctx.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.34,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.78
    );
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.48)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function loop(now) {
    if (!active) return;
    let dt = (now - lastTime) / 16.667;
    lastTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 1;
    if (dt > 3) dt = 3;
    time += dt * 0.016;
    render(dt);
    rafId = requestAnimationFrame(loop);
  }

  return {
    resize,
    start() {
      if (active) return;
      active = true;
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    },
    stop() { active = false; cancelAnimationFrame(rafId); },
    setPointer(x, y, on) { mouse.x = x; mouse.y = y; mouse.active = on; },
    onClick() { paletteIdx = (paletteIdx + 1) % PALETTES.length; }
  };
}

/* =========================================================
   网络校时 + 中央时钟（无秒）
   ========================================================= */
(function clock() {
  'use strict';
  const timeEl = document.getElementById('clockTime');
  const dateEl = document.getElementById('clockDate');
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  let offset = 0;
  let lastStr = '';

  const SOURCES = [
    { url: 'https://worldtimeapi.org/api/timezone/Etc/UTC',
      get: d => (typeof d.unixtime === 'number' ? d.unixtime * 1000 : null) },
    { url: 'https://timeapi.io/api/Time/current/zone?timeZone=Etc/UTC',
      get: d => {
        if (!d || !d.dateTime) return null;
        const t = Date.parse(d.dateTime.replace(/(\.\d+)?$/, '') + 'Z');
        return isNaN(t) ? null : t;
      } }
  ];

  async function sync() {
    for (let i = 0; i < SOURCES.length; i++) {
      const src = SOURCES[i];
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        const res = await fetch(src.url, { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) continue;
        const data = await res.json();
        const ms = src.get(data);
        if (ms && isFinite(ms)) { offset = ms - Date.now(); return true; }
      } catch (e) { /* 尝试下一个源 */ }
    }
    return false;
  }

  sync();
  setInterval(sync, 10 * 60 * 1000);

  const pad = n => (n < 10 ? '0' + n : '' + n);

  function tick() {
    const d = new Date(Date.now() + offset);
    const str = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (str !== lastStr) {
      lastStr = str;
      timeEl.textContent = str;
      dateEl.textContent =
        d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() +
        '日 星期' + WEEK[d.getDay()];
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* =========================================================
   主控：模式管理 + UI
   ========================================================= */
(function main() {
  'use strict';

  const ORDER = [
    'nebula', 'aurora', 'peaks', 'mountain', 'ocean',
    'snowforest', 'clouds', 'snowpeak', 'grassland', 'desert'
  ];

  const canvases = {
    nebula:     document.getElementById('c-nebula'),
    aurora:     document.getElementById('c-aurora'),
    peaks:      document.getElementById('c-peaks'),
    mountain:   document.getElementById('c-mountain'),
    ocean:      document.getElementById('c-ocean'),
    snowforest: document.getElementById('c-snowforest'),
    clouds:     document.getElementById('c-clouds'),
    snowpeak:   document.getElementById('c-snowpeak'),
    grassland:  document.getElementById('c-grassland'),
    desert:     document.getElementById('c-desert')
  };

  const factories = {
    nebula:     createNebula,
    aurora:     createAurora,
    peaks:      createPeaks,
    mountain:   createMountain,
    ocean:      createOcean,
    snowforest: createSnowForest,
    clouds:     createClouds,
    snowpeak:   createSnowPeak,
    grassland:  createGrassland,
    desert:     createDesert
  };

  const instances = {};

  ORDER.forEach(function (name) {
    const inst = factories[name](canvases[name]);
    inst.resize();
    canvases[name].style.opacity = (name === 'nebula') ? '1' : '0';
    instances[name] = inst;
  });

  let current = 'nebula';
  instances.nebula.start();

  const switcher = document.getElementById('switcher');
  const buttons = Array.prototype.slice.call(switcher.querySelectorAll('button'));

  function applyMode(name) {
    if (name === current || !instances[name]) return;
    instances[current].stop();
    instances[name].start();
    canvases[current].style.opacity = '0';
    canvases[name].style.opacity = '1';
    current = name;
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].dataset.mode === name);
    }
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyMode(btn.dataset.mode);
      wakeUI();
      btn.blur();
    });
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      const i = ORDER.indexOf(current);
      applyMode(ORDER[(i + 1) % ORDER.length]);
      wakeUI();
      return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= ORDER.length) {
      applyMode(ORDER[n - 1]);
      wakeUI();
    }
    if (e.key === '0') { applyMode(ORDER[9]); wakeUI(); }
  });

  function pointerMove(x, y) {
    const inst = instances[current];
    if (inst && inst.setPointer) inst.setPointer(x, y, true);
  }
  function pointerLeave() {
    for (let i = 0; i < ORDER.length; i++) {
      const inst = instances[ORDER[i]];
      if (inst && inst.setPointer) inst.setPointer(0, 0, false);
    }
  }
  function pointerDown(x, y) {
    const inst = instances[current];
    if (inst && inst.onClick) inst.onClick(x, y);
  }

  window.addEventListener('mousemove', function (e) {
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseleave', pointerLeave);
  window.addEventListener('mousedown', function (e) {
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', pointerLeave);

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      for (let i = 0; i < ORDER.length; i++) {
        instances[ORDER[i]].resize();
      }
    }, 130);
  });

  let idleTimer = null;
  function wakeUI() {
    document.body.classList.add('ui-visible');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      document.body.classList.remove('ui-visible');
    }, 2800);
  }

  window.addEventListener('mousemove', wakeUI);
  window.addEventListener('mousedown', wakeUI);
  window.addEventListener('touchstart', wakeUI, { passive: true });

  wakeUI();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screensaver</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000000;
        overflow: hidden;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    canvas { position: fixed; inset: 0; display: block; }

    #clock {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        user-select: none;
        animation: breathe 6s ease-in-out infinite;
        z-index: 5;
    }
    #time {
        font-size: clamp(64px, 14vw, 180px);
        font-weight: 100;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 0 30px rgba(120, 180, 255, 0.35);
        font-variant-numeric: tabular-nums;
    }
    #date {
        margin-top: 12px;
        font-size: clamp(14px, 2.2vw, 26px);
        font-weight: 300;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        color: rgba(255, 255, 255, 0.4);
    }
    @keyframes breathe {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
    }

    #core {
        position: fixed;
        top: 50%; left: 50%;
        width: 70vmin; height: 70vmin;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle,
            rgba(60, 120, 220, 0.10) 0%,
            rgba(140, 60, 220, 0.05) 45%,
            transparent 70%);
        animation: spin 40s linear infinite;
        pointer-events: none;
        display: none;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    #switcher {
        position: fixed;
        right: 28px; bottom: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        letter-spacing: 0.12em;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.6s ease, background 0.3s ease, border-color 0.3s ease;
        z-index: 10;
        white-space: nowrap;
    }
    #switcher.visible { opacity: 1; }
    #switcher:hover {
        background: rgba(255, 255, 255, 0.10);
        border-color: rgba(255, 255, 255, 0.4);
    }
    #switcher .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    #switcher .dot.active {
        background: #7ec8ff;
        box-shadow: 0 0 10px rgba(126, 200, 255, 0.8);
    }
    #switcher .sep { opacity: 0.3; }

    #otherBtn {
        position: fixed;
        right: 28px;
        bottom: 78px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-decoration: none;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.6s ease, background 0.3s ease, border-color 0.3s ease;
        z-index: 10;
        white-space: nowrap;
    }
    #otherBtn.visible { opacity: 1; }
    #otherBtn:hover {
        background: rgba(255, 255, 255, 0.10);
        border-color: rgba(255, 255, 255, 0.4);
        color: #fff;
    }
</style>
</head>
<body>

<canvas id="starsCanvas"></canvas>
<canvas id="auroraCanvas"></canvas>
<canvas id="networkCanvas"></canvas>
<canvas id="wavesCanvas"></canvas>
<canvas id="snowCanvas"></canvas>
<canvas id="bubblesCanvas"></canvas>
<div id="core"></div>

<div id="clock">
    <div id="time">--:--</div>
    <div id="date"></div>
</div>

<div id="switcher">
    <span class="dot active" data-mode="starfield"></span>星空
    <span class="sep">/</span>
    <span class="dot" data-mode="aurora"></span>极光
    <span class="sep">/</span>
    <span class="dot" data-mode="network"></span>粒子
    <span class="sep">/</span>
    <span class="dot" data-mode="waves"></span>流光
    <span class="sep">/</span>
    <span class="dot" data-mode="snow"></span>飘雪
    <span class="sep">/</span>
    <span class="dot" data-mode="bubbles"></span>气泡
</div>

<a id="otherBtn" href="page2.html" target="_blank" rel="noopener">其它</a>

<script>
(function () {
    const canvases = {
        starfield: document.getElementById('starsCanvas'),
        aurora: document.getElementById('auroraCanvas'),
        network: document.getElementById('networkCanvas'),
        waves: document.getElementById('wavesCanvas'),
        snow: document.getElementById('snowCanvas'),
        bubbles: document.getElementById('bubblesCanvas')
    };
    const sctx = canvases.starfield.getContext('2d');
    const actx = canvases.aurora.getContext('2d');
    const nctx = canvases.network.getContext('2d');
    const wctx = canvases.waves.getContext('2d');
    const snctx = canvases.snow.getContext('2d');
    const bctx = canvases.bubbles.getContext('2d');

    const clockEl = document.getElementById('clock');
    const coreEl = document.getElementById('core');
    const switcher = document.getElementById('switcher');
    const dots = switcher.querySelectorAll('.dot');

    const MODES = ['starfield', 'aurora', 'network', 'waves', 'snow', 'bubbles'];
    let mode = 'starfield';
    let W = 0, H = 0;

    /* ================= 星空 ================= */
    let stars = [], meteors = [];
    const DEPTH = 3;

    function initStars() {
        stars = [];
        const count = Math.floor((W * H) / 5200);
        for (let i = 0; i < count; i++) {
            const layer = Math.floor(Math.random() * DEPTH) + 1;
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                layer: layer,
                size: layer * 0.6 + Math.random() * 1.0,
                baseAlpha: 0.25 + Math.random() * 0.6,
                phase: Math.random() * Math.PI * 2,
                speed: 0.4 + Math.random() * 0.8,
                vx: -(layer * 0.05),
                hue: Math.random() < 0.12 ? 200 + Math.random() * 60 : null
            });
        }
    }

    function spawnMeteor() {
        if (mode !== 'starfield') { setTimeout(spawnMeteor, 3000); return; }
        const fromLeft = Math.random() < 0.5;
        meteors.push({
            x: fromLeft ? Math.random() * W * 0.4 : W * (0.6 + Math.random() * 0.4),
            y: Math.random() * H * 0.35,
            len: 120 + Math.random() * 180,
            angle: Math.PI / 4 + (Math.random() - 0.5) * 0.4,
            speed: 9 + Math.random() * 7,
            life: 1
        });
        setTimeout(spawnMeteor, 2500 + Math.random() * 6000);
    }

    function drawStars(t) {
        sctx.fillStyle = '#000000';
        sctx.fillRect(0, 0, W, H);

        for (const s of stars) {
            const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
            const alpha = s.baseAlpha * (0.35 + 0.65 * twinkle);
            s.x += s.vx;
            if (s.x < -4) s.x = W + 4;

            sctx.beginPath();
            sctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            sctx.fillStyle = s.hue !== null
                ? `hsla(${s.hue}, 90%, 75%, ${alpha})`
                : `rgba(255, 255, 255, ${alpha})`;
            sctx.fill();

            if (s.layer === DEPTH && twinkle > 0.85) {
                sctx.beginPath();
                sctx.arc(s.x, s.y, s.size * 3.2, 0, Math.PI * 2);
                sctx.fillStyle = `rgba(180, 210, 255, ${(twinkle - 0.85) * 0.35})`;
                sctx.fill();
            }
        }

        meteors = meteors.filter(m => m.life > 0);
        for (const m of meteors) {
            m.x += Math.cos(m.angle) * m.speed;
            m.y += Math.sin(m.angle) * m.speed;
            m.life -= 0.008;

            const tailX = m.x - Math.cos(m.angle) * m.len;
            const tailY = m.y - Math.sin(m.angle) * m.len;
            const grad = sctx.createLinearGradient(m.x, m.y, tailX, tailY);
            grad.addColorStop(0, `rgba(255,255,255,${0.9 * m.life})`);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            sctx.strokeStyle = grad;
            sctx.lineWidth = 1.6;
            sctx.lineCap = 'round';
            sctx.beginPath();
            sctx.moveTo(m.x, m.y);
            sctx.lineTo(tailX, tailY);
            sctx.stroke();

            sctx.beginPath();
            sctx.arc(m.x, m.y, 2.2, 0, Math.PI * 2);
            sctx.fillStyle = `rgba(255,255,255,${m.life})`;
            sctx.fill();
        }
    }

    /* ================= 极光 ================= */
    const wavesA = [];
    for (let i = 0; i < 5; i++) {
        wavesA.push({
            amplitude: 40 + Math.random() * 70,
            frequency: 0.0016 + Math.random() * 0.0014,
            speed: 0.15 + Math.random() * 0.3,
            phase: Math.random() * Math.PI * 2,
            baseY: 0.25 + i * 0.14,
            thickness: 50 + Math.random() * 90,
            hueBase: 140 + i * 35,
            drift: (Math.random() - 0.5) * 0.02
        });
    }

    let orbs = [];
    function initOrbs() {
        orbs = [];
        const count = Math.floor((W * H) / 22000);
        for (let i = 0; i < count; i++) {
            orbs.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: 1.2 + Math.random() * 2.2,
                vx: (Math.random() - 0.5) * 0.15,
                vy: -0.05 - Math.random() * 0.15,
                hue: 160 + Math.random() * 120,
                phase: Math.random() * Math.PI * 2,
                pulse: 0.5 + Math.random() * 0.8
            });
        }
    }

    function drawAurora(t) {
        actx.fillStyle = '#000000';
        actx.fillRect(0, 0, W, H);
        actx.globalCompositeOperation = 'lighter';

        for (const w of wavesA) {
            w.phase += w.speed * 0.016;
            w.baseY += w.drift * 0.016;
            if (w.baseY < 0.15 || w.baseY > 0.85) w.drift *= -1;

            const yBase = w.baseY * H;
            const hue = (w.hueBase + Math.sin(t * 0.1) * 20 + 360) % 360;

            actx.beginPath();
            for (let x = 0; x <= W; x += 6) {
                const y = yBase
                    + Math.sin(x * w.frequency + w.phase) * w.amplitude
                    + Math.sin(x * w.frequency * 2.3 + w.phase * 1.7) * w.amplitude * 0.35;
                x === 0 ? actx.moveTo(x, y) : actx.lineTo(x, y);
            }

            const grad = actx.createLinearGradient(0, yBase - w.amplitude, 0, yBase + w.thickness);
            grad.addColorStop(0, `hsla(${hue}, 90%, 60%, 0)`);
            grad.addColorStop(0.4, `hsla(${hue}, 90%, 60%, 0.10)`);
            grad.addColorStop(0.7, `hsla(${(hue + 30) % 360}, 90%, 55%, 0.05)`);
            grad.addColorStop(1, `hsla(${hue}, 90%, 60%, 0)`);
            actx.lineTo(W, yBase + w.thickness * 2);
            actx.lineTo(0, yBase + w.thickness * 2);
            actx.closePath();
            actx.fillStyle = grad;
            actx.fill();

            actx.beginPath();
            for (let x = 0; x <= W; x += 6) {
                const y = yBase
                    + Math.sin(x * w.frequency + w.phase) * w.amplitude
                    + Math.sin(x * w.frequency * 2.3 + w.phase * 1.7) * w.amplitude * 0.35;
                x === 0 ? actx.moveTo(x, y) : actx.lineTo(x, y);
            }
            actx.strokeStyle = `hsla(${hue}, 100%, 75%, 0.35)`;
            actx.lineWidth = 1.2;
            actx.stroke();
        }

        for (const o of orbs) {
            o.x += o.vx;
            o.y += o.vy;
            if (o.y < -10) { o.y = H + 10; o.x = Math.random() * W; }
            if (o.x < -10) o.x = W + 10;
            if (o.x > W + 10) o.x = -10;

            const glow = 0.55 + 0.45 * Math.sin(t * o.pulse + o.phase);
            const r = o.r * (0.85 + 0.15 * glow);

            actx.beginPath();
            actx.arc(o.x, o.y, r, 0, Math.PI * 2);
            actx.fillStyle = `hsla(${o.hue}, 85%, 70%, ${0.75 * glow + 0.2})`;
            actx.fill();
            actx.beginPath();
            actx.arc(o.x - r * 0.25, o.y - r * 0.25, r * 0.45, 0, Math.PI * 2);
            actx.fillStyle = `hsla(${o.hue}, 60%, 92%, ${0.8 * glow})`;
            actx.fill();
        }

        actx.globalCompositeOperation = 'source-over';
    }

    /* ================= 粒子星座 ================= */
    let nodes = [];

    function initNetwork() {
        nodes = [];
        const count = Math.floor((W * H) / 16000);
        for (let i = 0; i < count; i++) {
            nodes.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r: 1 + Math.random() * 1.6,
                hue: Math.random() < 0.3 ? 190 + Math.random() * 40 : null,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    const LINK_DIST = 130;

    function drawNetwork(t) {
        nctx.fillStyle = '#000000';
        nctx.fillRect(0, 0, W, H);

        for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            for (let j = i + 1; j < nodes.length; j++) {
                const b = nodes[j];
                const dx = a.x - b.x, dy = a.y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist < LINK_DIST) {
                    const alpha = (1 - dist / LINK_DIST) * 0.22;
                    nctx.strokeStyle = `rgba(140, 190, 255, ${alpha})`;
                    nctx.lineWidth = 0.7;
                    nctx.beginPath();
                    nctx.moveTo(a.x, a.y);
                    nctx.lineTo(b.x, b.y);
                    nctx.stroke();
                }
            }
        }

        for (const n of nodes) {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < -5) n.x = W + 5; if (n.x > W + 5) n.x = -5;
            if (n.y < -5) n.y = H + 5; if (n.y > H + 5) n.y = -5;

            const tw = 0.6 + 0.4 * Math.sin(t * 1.2 + n.phase);
            nctx.beginPath();
            nctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            nctx.fillStyle = n.hue !== null
                ? `hsla(${n.hue}, 85%, 75%, ${tw})`
                : `rgba(255, 255, 255, ${tw * 0.9})`;
            nctx.fill();
        }
    }

    /* ================= 流光 ================= */
    const ribbons = [];
    for (let i = 0; i < 6; i++) {
        ribbons.push({
            amplitude: 30 + Math.random() * 60,
            frequency: 0.002 + Math.random() * 0.002,
            speed: 0.3 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2,
            baseY: 0.18 + i * 0.12,
            thickness: 90 + Math.random() * 120,
            hueOffset: i * 55
        });
    }

    let glints = [];
    function initGlints() {
        glints = [];
        const count = Math.floor((W * H) / 26000);
        for (let i = 0; i < count; i++) {
            glints.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: 0.3 + Math.random() * 0.6,
                r: 0.8 + Math.random() * 1.6,
                hue: Math.random() * 360,
                phase: Math.random() * Math.PI * 2,
                pulse: 0.6 + Math.random() * 1.2
            });
        }
    }

    function drawWaves(t) {
        wctx.fillStyle = '#000000';
        wctx.fillRect(0, 0, W, H);
        wctx.globalCompositeOperation = 'lighter';

        for (const rb of ribbons) {
            const yBase = rb.baseY * H;
            const hue = (t * 14 + rb.hueOffset) % 360;

            wctx.beginPath();
            for (let x = 0; x <= W; x += 5) {
                const y = yBase
                    + Math.sin(x * rb.frequency + rb.phase + t * rb.speed) * rb.amplitude
                    + Math.sin(x * rb.frequency * 2.1 + rb.phase * 1.6 - t * rb.speed * 1.4) * rb.amplitude * 0.4;
                x === 0 ? wctx.moveTo(x, y) : wctx.lineTo(x, y);
            }
            const grad = wctx.createLinearGradient(0, yBase - rb.amplitude, 0, yBase + rb.thickness);
            grad.addColorStop(0, `hsla(${hue}, 95%, 60%, 0)`);
            grad.addColorStop(0.5, `hsla(${hue}, 95%, 60%, 0.12)`);
            grad.addColorStop(0.8, `hsla(${(hue + 40) % 360}, 95%, 55%, 0.06)`);
            grad.addColorStop(1, `hsla(${hue}, 95%, 60%, 0)`);
            wctx.lineTo(W, yBase + rb.thickness * 2);
            wctx.lineTo(0, yBase + rb.thickness * 2);
            wctx.closePath();
            wctx.fillStyle = grad;
            wctx.fill();

            wctx.beginPath();
            for (let x = 0; x <= W; x += 5) {
                const y = yBase
                    + Math.sin(x * rb.frequency + rb.phase + t * rb.speed) * rb.amplitude
                    + Math.sin(x * rb.frequency * 2.1 + rb.phase * 1.6 - t * rb.speed * 1.4) * rb.amplitude * 0.4;
                x === 0 ? wctx.moveTo(x, y) : wctx.lineTo(x, y);
            }
            wctx.strokeStyle = `hsla(${hue}, 100%, 78%, 0.5)`;
            wctx.lineWidth = 1.4;
            wctx.stroke();
        }

        for (const g of glints) {
            g.x += g.vx;
            if (g.x > W + 10) g.x = -10;
            const alpha = 0.4 + 0.6 * Math.abs(Math.sin(t * g.pulse + g.phase));
            wctx.beginPath();
            wctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
            wctx.fillStyle = `hsla(${(g.hue + t * 20) % 360}, 90%, 75%, ${alpha})`;
            wctx.fill();
        }

        wctx.globalCompositeOperation = 'source-over';
    }

    /* ================= 飘雪 ================= */
    let flakes = [];

    function initSnow() {
        flakes = [];
        const count = Math.floor((W * H) / 4200);
        for (let i = 0; i < count; i++) {
            const layer = Math.floor(Math.random() * 3) + 1;
            flakes.push({
                x: Math.random() * W,
                y: Math.random() * H,
                layer: layer,
                r: layer * 0.9 + Math.random() * 1.4,
                vy: layer * 0.35 + Math.random() * 0.5,
                swayAmp: 0.4 + Math.random() * 1.2,
                swayFreq: 0.5 + Math.random() * 1.0,
                phase: Math.random() * Math.PI * 2,
                alpha: 0.35 + layer * 0.18
            });
        }
    }

    function drawSnow(t) {
        snctx.fillStyle = '#000000';
        snctx.fillRect(0, 0, W, H);

        for (const f of flakes) {
            f.y += f.vy;
            f.x += Math.sin(t * f.swayFreq + f.phase) * f.swayAmp * 0.4;
            if (f.y > H + 6) {
                f.y = -6;
                f.x = Math.random() * W;
            }
            if (f.x < -6) f.x = W + 6;
            if (f.x > W + 6) f.x = -6;

            snctx.beginPath();
            snctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            snctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
            snctx.fill();

            if (f.layer === 3) {
                snctx.strokeStyle = `rgba(255, 255, 255, ${f.alpha * 0.35})`;
                snctx.lineWidth = 0.6;
                snctx.beginPath();
                snctx.moveTo(f.x - f.r * 2, f.y);
                snctx.lineTo(f.x + f.r * 2, f.y);
                snctx.moveTo(f.x, f.y - f.r * 2);
                snctx.lineTo(f.x, f.y + f.r * 2);
                snctx.stroke();
            }
        }
    }

    /* ================= 气泡 ================= */
    let bubbles = [];

    function initBubbles() {
        bubbles = [];
        const count = Math.floor((W * H) / 18000);
        for (let i = 0; i < count; i++) {
            bubbles.push(newBubble(true));
        }
    }

    function newBubble(anywhere) {
        const r = 3 + Math.random() * 16;
        return {
            x: Math.random() * W,
            y: anywhere ? Math.random() * H : H + r + 10,
            r: r,
            vy: 0.3 + (20 - r) * 0.045 + Math.random() * 0.3,
            wobbleAmp: 0.3 + Math.random() * 0.9,
            wobbleFreq: 0.4 + Math.random() * 0.9,
            phase: Math.random() * Math.PI * 2,
            hue: 170 + Math.random() * 80,
            alpha: 0.10 + Math.random() * 0.16
        };
    }

    function drawBubbles(t) {
        bctx.fillStyle = '#000000';
        bctx.fillRect(0, 0, W, H);

        for (const b of bubbles) {
            b.y -= b.vy;
            b.x += Math.sin(t * b.wobbleFreq + b.phase) * b.wobbleAmp * 0.5;
            if (b.y < -b.r - 12) Object.assign(b, newBubble(false));

            bctx.beginPath();
            bctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            bctx.fillStyle = `hsla(${b.hue}, 70%, 60%, ${b.alpha})`;
            bctx.fill();

            bctx.beginPath();
            bctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            bctx.strokeStyle = `hsla(${b.hue}, 80%, 75%, ${b.alpha * 1.6})`;
            bctx.lineWidth = 0.8;
            bctx.stroke();

            bctx.beginPath();
            bctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.38, b.r * 0.28, 0, Math.PI * 2);
            bctx.fillStyle = `rgba(255, 255, 255, ${b.alpha * 2.2})`;
            bctx.fill();

            bctx.beginPath();
            bctx.arc(b.x + b.r * 0.3, b.y + b.r * 0.42, b.r * 0.14, 0, Math.PI * 2);
            bctx.fillStyle = `rgba(255, 255, 255, ${b.alpha * 1.4})`;
            bctx.fill();
        }
    }

    /* ================= 时钟 ================= */
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const week = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    let timeOffset = 0;

    async function syncNetworkTime() {
        const apis = [
            async () => {
                const r = await fetch('https://worldtimeapi.org/api/timezone/Asia/Shanghai', { cache: 'no-store' });
                if (!r.ok) throw 0;
                const j = await r.json();
                return j.unixtime * 1000;
            },
            async () => {
                const r = await fetch('https://api.m.jd.com/client.action?functionId=queryMaterialProducts&client=wh5', { cache: 'no-store' });
                const d = Date.parse(r.headers.get('Date'));
                if (isNaN(d)) throw 0;
                return d;
            }
        ];
        for (const api of apis) {
            try {
                const start = Date.now();
                const netMs = await api();
                const rtt = Date.now() - start;
                timeOffset = netMs + rtt / 2 - Date.now();
                return;
            } catch (e) { }
        }
    }

    function now() {
        return new Date(Date.now() + timeOffset);
    }

    function tick() {
        const d = now();
        const p = n => String(n).padStart(2, '0');
        timeEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
        dateEl.textContent =
            `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}  ${week[d.getDay()]}`;
    }

    tick();
    setInterval(tick, 1000);
    syncNetworkTime();
    setInterval(syncNetworkTime, 10 * 60 * 1000);

    /* ================= 模式切换 ================= */
    function applyMode() {
        for (const m of MODES) {
            canvases[m].style.display = (m === mode) ? 'block' : 'none';
        }
        coreEl.style.display = (mode === 'aurora') ? 'block' : 'none';
        dots.forEach(d => d.classList.toggle('active', d.dataset.mode === mode));
    }

    function toggleMode() {
        const i = MODES.indexOf(mode);
        mode = MODES[(i + 1) % MODES.length];
        applyMode();
    }

    const AUTO_INTERVAL = 5 * 60 * 1000;
    let autoTimer = setInterval(toggleMode, AUTO_INTERVAL);

    function manualSwitch() {
        toggleMode();
        clearInterval(autoTimer);
        autoTimer = setInterval(toggleMode, AUTO_INTERVAL);
    }

    switcher.addEventListener('click', manualSwitch);
    window.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'KeyS') {
            e.preventDefault();
            manualSwitch();
            showSwitcher();
        }
    });

    const otherBtn = document.getElementById('otherBtn');

    let hideTimer = null;
    function showSwitcher() {
        switcher.classList.add('visible');
        otherBtn.classList.add('visible');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            switcher.classList.remove('visible');
            otherBtn.classList.remove('visible');
        }, 3000);
    }
    window.addEventListener('mousemove', showSwitcher);
    window.addEventListener('touchstart', showSwitcher, { passive: true });

    /* ================= 主循环 ================= */
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        for (const m of MODES) {
            canvases[m].width = W;
            canvases[m].height = H;
        }
        initStars();
        initOrbs();
        initNetwork();
        initGlints();
        initSnow();
        initBubbles();
    }
    window.addEventListener('resize', resize);

    let t = 0;
    function loop() {
        t += 0.016;
        switch (mode) {
            case 'starfield': drawStars(t); break;
            case 'aurora': drawAurora(t); break;
            case 'network': drawNetwork(t); break;
            case 'waves': drawWaves(t); break;
            case 'snow': drawSnow(t); break;
            case 'bubbles': drawBubbles(t); break;
        }
        requestAnimationFrame(loop);
    }

    resize();
    applyMode();
    showSwitcher();
    loop();
    setTimeout(spawnMeteor, 1500);
})();
</script>
</body>
</html>

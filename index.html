<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A101 图纸预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #1e1f22; color: #ddd;
      display: flex; flex-direction: column;
    }

    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; background: #2b2d31;
      border-bottom: 1px solid #3a3d42; flex-shrink: 0;
    }
    .toolbar .title { font-size: 14px; font-weight: 600; color: #fff; margin-right: auto; }
    .toolbar .file { font-size: 13px; color: #81c995; }

    button {
      font: inherit; font-size: 13px;
      background: #3a3d42; color: #e6e6e6;
      border: 1px solid #4b4f56; border-radius: 4px;
      padding: 6px 12px; cursor: pointer;
    }
    button:hover { background: #4b4f56; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #status {
      font-size: 12px; color: #9aa0a8; min-width: 160px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #status.error { color: #f28b82; }
    #status.success { color: #81c995; }

    #canvas-container {
      flex: 1; position: relative; min-height: 0;
      background: #f0f2f5;
    }
    #myCanvas { width: 100%; height: 100%; display: block; }

    .empty-hint {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #888; font-size: 14px; gap: 6px;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .empty-hint strong { color: #555; font-size: 16px; }
    .empty-hint.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

<div class="toolbar">
  <span class="title">📐 A101 图纸预览</span>
  <span class="file" id="fileName">A101.dwg</span>
  <button id="reloadBtn" disabled>重新加载</button>
  <button id="homeBtn" disabled>复位视图</button>
  <span id="status">初始化中…</span>
</div>

<div id="canvas-container">
  <canvas id="myCanvas"></canvas>
  <div class="empty-hint" id="emptyHint">
    <strong>🖼 正在准备加载 A101.dwg</strong>
    <span>若长时间无反应，请按 F12 查看控制台报错</span>
  </div>
</div>

<!-- 修正了 CDN 路径，去掉了错误的 /dist/index.js，使用 UNPKG 自动解析 -->
<script type="importmap">
{
  "imports": {
    "@x-viewer/core": "https://unpkg.com/@x-viewer/core@0.21.24"
  }
}
</script>

<script type="module">
import { Viewer2d } from '@x-viewer/core';

// ====== 这里改成你的文件名（与 HTML 同目录） ======
const DWG_FILE = 'A101.dwg';

const reloadBtn = document.getElementById('reloadBtn');
const homeBtn   = document.getElementById('homeBtn');
const statusEl  = document.getElementById('status');
const emptyHint = document.getElementById('emptyHint');
const fileNameEl = document.getElementById('fileName');

fileNameEl.textContent = DWG_FILE;

let viewer = null;
let viewerReady = false;

function initViewer() {
  if (viewerReady) return;
  viewer = new Viewer2d({
    containerId: 'myCanvas',
    enableSpinner: true,
    enableLayoutBar: true,
  });
  viewerReady = true;
  console.log('[CAD] Viewer2d 初始化完成');
}

function setStatus(text, type = '') {
  statusEl.textContent = text;
  statusEl.className = type;
}

async function loadDwg(url, displayName) {
  initViewer();
  setStatus(`加载中 ${displayName} …`);
  reloadBtn.disabled = true;
  homeBtn.disabled = true;
  emptyHint.classList.remove('hide');

  try {
    await viewer.loadModel(
      {
        modelId: 'a101_' + Date.now(),
        name: displayName,
        src: url,
      },
      (event) => {
        if (event.total > 0) {
          const pct = ((event.loaded / event.total) * 100).toFixed(0);
          setStatus(`加载中 ${displayName} … ${pct}%`);
        }
      }
    );

    viewer.goToHomeView();
    emptyHint.classList.add('hide');
    reloadBtn.disabled = false;
    homeBtn.disabled = false;
    setStatus(`✅ ${displayName} 已加载`, 'success');
    console.log('[CAD] 加载完成:', displayName);
  } catch (err) {
    console.error('[CAD] 加载失败:', err);
    setStatus(`❌ 加载失败: ${err.message || err}`, 'error');
    reloadBtn.disabled = false;
    alert(
      '图纸加载失败：' + (err.message || err) + '\n\n' +
      '请检查：\n' +
      '1. A101.dwg 是否与本 HTML 在同一目录\n' +
      '2. 是否通过 HTTP 服务访问（不能直接双击打开 HTML）\n' +
      '3. 文件名大小写是否完全一致\n' +
      '4. 浏览器控制台（F12）是否有网络报错'
    );
  }
}

// 页面加载后自动开始
window.addEventListener('load', () => {
  if (location.protocol === 'file:') {
    setStatus('❌ 请通过 HTTP 服务访问', 'error');
    alert(
      '当前是 file:// 方式打开，浏览器会阻止读取本地 DWG。\n\n' +
      '请在本文件夹执行：\n' +
      '  python -m http.server 8000\n' +
      '然后访问 http://localhost:8000/当前文件名.html'
    );
    return;
  }
  loadDwg(encodeURIComponent(DWG_FILE), DWG_FILE);
});

reloadBtn.addEventListener('click', () => {
  loadDwg(encodeURIComponent(DWG_FILE), DWG_FILE);
});

homeBtn.addEventListener('click', () => {
  if (viewer && viewerReady) {
    viewer.goToHomeView();
    setStatus('视图已复位', 'success');
  }
});

window.addEventListener('beforeunload', () => {
  if (viewer && typeof viewer.dispose === 'function') {
    try { viewer.dispose(); } catch (_) {}
  }
});
</script>

</body>
</html>
